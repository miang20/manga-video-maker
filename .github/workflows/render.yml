name: Render Video
run-name: Render ${{ inputs.project || 'video-001' }}${{ inputs.preview_only && ' (preview only)' || '' }}
on:
  workflow_call:
    inputs:
      project: {type: string, required: false, default: video-001}
      voice_source: {type: string, required: false, default: project}
      voice: {type: string, required: false, default: af_heart}
      voice_speed: {type: string, required: false, default: '1.0'}
      style: {type: string, required: false, default: project}
      motion_intensity: {type: string, required: false, default: project}
      music_on: {type: boolean, required: false, default: true}
      shorts_on: {type: boolean, required: false, default: true}
      preview_only: {type: boolean, required: false, default: false}
      artifact_name: {type: string, required: false, default: ''}
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under projects/, e.g. video-001"
        required: true
        default: video-001
        type: string
      shorts_start:
        description: "Optional Shorts start seconds"
        required: false
        type: string
      shorts_end:
        description: "Optional Shorts end seconds"
        required: false
        type: string
      preview_only:
        description: "Only validate strict filename-order image preview"
        required: false
        default: false
        type: boolean
      caption_mode:
        description: "Caption mode requested by the front end"
        required: false
        default: overlay
        type: choice
        options:
          - overlay
          - card
      caption_size:
        description: "Caption size requested by the front end"
        required: false
        default: "76"
        type: string
      music_on:
        description: "Music toggle requested by the front end"
        required: false
        default: true
        type: boolean
      shorts_on:
        description: "Shorts toggle requested by the front end"
        required: false
        default: true
        type: boolean
      voice_source:
        description: "Voice source"
        required: false
        default: project
        type: choice
        options:
          - project
          - upload
          - kokoro
      voice:
        description: "Kokoro English voice"
        required: false
        default: af_heart
        type: choice
        options:
          - af_heart
          - af_alloy
          - af_aoede
          - af_bella
          - af_jessica
          - af_kore
          - af_nicole
          - af_nova
          - af_river
          - af_sarah
          - af_sky
          - am_adam
          - am_echo
          - am_eric
          - am_fenrir
          - am_liam
          - am_michael
          - am_onyx
          - am_puck
          - am_santa
          - bf_alice
          - bf_emma
          - bf_isabella
          - bf_lily
          - bm_daniel
          - bm_fable
          - bm_george
          - bm_lewis
      voice_speed:
        description: "Kokoro speech speed from 0.7 to 1.3"
        required: false
        default: "1.0"
        type: string
      style:
        description: "Image style preset"
        required: false
        default: project
        type: choice
        options:
          - project
          - bw_manga
          - color
          - clean
      motion_intensity:
        description: "Camera motion intensity"
        required: false
        default: project
        type: choice
        options:
          - project
          - subtle
          - normal
          - strong
      test_voice:
        description: "Compatibility option; missing voice is always generated automatically"
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: actions/setup-python@v5
        id: setup_python
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache faster-whisper model
        id: cache_whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ runner.os }}-base.en-v1
          restore-keys: |
            faster-whisper-${{ runner.os }}-base.en-
      - name: Install FFmpeg and fonts
        if: ${{ !inputs.preview_only }}
        id: install_ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies
        id: install_dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-render.txt
      - name: Install optional Nunito font
        if: ${{ !inputs.preview_only }}
        id: install_font
        run: python setup_fonts.py
      - name: Run syntax and YAML validation
        id: syntax_validation
        run: |
          python -m py_compile render.py app.py setup_fonts.py src/*.py tests/*.py
          python - <<'PY'
          import yaml
          with open("config.yaml", encoding="utf-8") as f:
              assert isinstance(yaml.safe_load(f), dict), "config.yaml must contain a YAML mapping"
          with open(".github/workflows/render.yml", encoding="utf-8") as f:
              workflow = yaml.safe_load(f)
          assert isinstance(workflow, dict) and isinstance(workflow.get("jobs"), dict), "render.yml is not a valid workflow mapping"
          print("PY_COMPILE=PASS")
          print("YAML_VALIDATION=PASS")
          PY
      - name: Run alignment unit tests
        if: ${{ !inputs.preview_only }}
        id: alignment_tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure sample project and offline inputs
        if: ${{ !inputs.preview_only }}
        id: ensure_sample
        env:
          PROJECT_INPUT: ${{ inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from src.sample_assets import ensure_sample_project, ensure_test_voice, ensure_thumbnail

          name = os.environ["PROJECT_INPUT"].strip()
          if not name or "/" in name or chr(92) in name or name in {".", ".."}:
              raise SystemExit("Project must be one folder name such as video-001.")
          project = Path("projects") / name
          if name == "video-001":
              ensure_sample_project(project)
          ensure_thumbnail(project, Path("output"))
          if not (project / "script.txt").is_file():
              raise SystemExit(f"Missing script file: {project / 'script.txt'}")
          voice_paths = [project / f"voice{ext}" for ext in (".mp3", ".wav", ".m4a", ".ogg")]
          generated_voice = not any(path.is_file() and path.stat().st_size for path in voice_paths)
          if generated_voice:
              ensure_test_voice(project)
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write("SELF_TEST_MODE=true\n")
              print("SELF_TEST_MODE=PASS; generated offline test voice")
          else:
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write("SELF_TEST_MODE=false\n")
              print("SELF_TEST_MODE=PASS; uploaded voice found")
          music_dir = Path("assets/music")
          music_dir.mkdir(parents=True, exist_ok=True)
          has_music = any(path.is_file() and path.suffix.lower() == ".mp3" for path in music_dir.iterdir())
          pad = music_dir / "000-self-test-pad.mp3"
          if generated_voice or not has_music:
              subprocess.run([
                  "ffmpeg", "-y", "-f", "lavfi", "-i",
                  "aevalsrc=0.020*sin(2*PI*110*t)+0.015*sin(2*PI*164.81*t)+0.010*sin(2*PI*220*t):s=44100:d=120",
                  "-af", "lowpass=f=900,afade=t=in:st=0:d=2,afade=t=out:st=115:d=5",
                  "-codec:a", "libmp3lame", "-b:a", "96k", str(pad)
              ], check=True, capture_output=True, text=True)
              print(f"MUSIC_PAD_GENERATED={pad}")
          image_files = [path for path in (project / "images").glob("*")
                         if path.is_file() and path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}]
          if name == "video-001" and len(image_files) < 4:
              raise SystemExit(f"Sample project needs at least 4 numbered images; found {len(image_files)}")
          print(f"SAMPLE_IMAGES_COUNT={len(image_files)}")
          print(f"PROJECT_READY={project}")
          PY
      - name: Cache Kokoro CPU wheels
        if: ${{ !inputs.preview_only && inputs.voice_source == 'kokoro' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: kokoro-cpu-py311-torch260-transformers449-${{ runner.os }}-v1
      - name: Install Kokoro only when selected
        if: ${{ !inputs.preview_only }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          VOICE_SOURCE_INPUT: ${{ github.event.inputs.voice_source || 'project' }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          project = Path('projects') / os.environ['PROJECT_INPUT']
          settings = {}
          config = project / 'project.json'
          if config.is_file(): settings = json.loads(config.read_text(encoding='utf-8'))
          selected = os.environ.get('VOICE_SOURCE_INPUT', 'project')
          if selected != 'project': settings['voice_source'] = selected
          if settings.get('voice_source', 'upload') == 'kokoro':
              # Install CPU PyTorch first so Kokoro/Transformers cannot resolve an incompatible build.
              subprocess.run([sys.executable, '-m', 'pip', 'install', '--index-url', 'https://download.pytorch.org/whl/cpu', 'torch==2.6.0+cpu'], check=True)
              subprocess.run([sys.executable, '-m', 'pip', 'install', 'transformers==4.49.0', 'kokoro==0.9.4', 'soundfile'], check=True)
              subprocess.run([sys.executable, '-c', "import importlib.metadata as md, torch, transformers, kokoro; print('TORCH_VERSION=' + torch.__version__); print('TRANSFORMERS_VERSION=' + transformers.__version__); print('KOKORO_VERSION=' + md.version('kokoro')); assert tuple(map(int, torch.__version__.split('+')[0].split('.')[:2])) >= (2, 6), 'PyTorch >=2.6 required'; assert torch.version.cuda is None, 'Expected CPU-only PyTorch'; assert transformers.__version__ == '4.49.0', 'Unexpected Transformers version'; print('KOKORO_IMPORT_CHECK=PASS')"], check=True)
              print('KOKORO_DEPENDENCIES=INSTALLED_AND_VERIFIED')
          else:
              print('KOKORO_DEPENDENCIES=SKIPPED; upload/project voice does not install torch')
          PY
      - name: Prepare effective render settings
        if: ${{ !inputs.preview_only }}
        env:
          CAPTION_MODE_INPUT: ${{ github.event.inputs.caption_mode || 'overlay' }}
          CAPTION_SIZE_INPUT: ${{ github.event.inputs.caption_size || '76' }}
          MUSIC_ON_INPUT: ${{ github.event.inputs.music_on || 'true' }}
          VOICE_SOURCE_INPUT: ${{ github.event.inputs.voice_source || 'project' }}
          VOICE_INPUT: ${{ github.event.inputs.voice || 'af_heart' }}
          VOICE_SPEED_INPUT: ${{ github.event.inputs.voice_speed || '1.0' }}
          STYLE_INPUT: ${{ github.event.inputs.style || 'project' }}
          MOTION_INPUT: ${{ github.event.inputs.motion_intensity || 'project' }}
          SHORTS_ON_INPUT: ${{ github.event.inputs.shorts_on || 'true' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('config.yaml').read_text(encoding='utf-8'))
          def enabled(name):
              return os.environ.get(name, 'true').strip().lower() not in {'false', '0', 'no', 'off'}
          mode = os.environ.get('CAPTION_MODE_INPUT', 'overlay').strip().lower()
          if mode not in {'overlay', 'card'}:
              raise SystemExit('caption_mode must be overlay or card.')
          try:
              size = max(40, min(100, int(os.environ.get('CAPTION_SIZE_INPUT', '76'))))
          except ValueError:
              raise SystemExit('caption_size must be a number from 40 to 100.')
          config.setdefault('captions', {})['caption_mode'] = mode
          config['captions']['size'] = size
          config['captions']['card_size'] = max(48, int(round(size * 88 / 76)))
          config.setdefault('music', {})['enabled'] = enabled('MUSIC_ON_INPUT')
          import json
          overrides = {}
          for env_name, key in [('VOICE_SOURCE_INPUT','voice_source'),('VOICE_INPUT','voice'),('VOICE_SPEED_INPUT','voice_speed'),('STYLE_INPUT','style'),('MOTION_INPUT','motion_intensity')]:
              value = os.environ.get(env_name, 'project')
              if value and value != 'project': overrides[key] = float(value) if key == 'voice_speed' else value
          Path('/tmp/settings-overrides.json').write_text(json.dumps(overrides), encoding='utf-8')
          Path('/tmp/config-render.yaml').write_text(yaml.safe_dump(config, sort_keys=False), encoding='utf-8')
          Path('/tmp/shorts-enabled.txt').write_text('true' if enabled('SHORTS_ON_INPUT') else 'false', encoding='utf-8')
          print('RENDER_SETTINGS=' + str({'caption_mode': mode, 'caption_size': size, 'music_on': config['music']['enabled'], 'shorts_on': enabled('SHORTS_ON_INPUT')}))
          PY
      - name: Render landscape MP4
        if: ${{ !inputs.preview_only }}
        id: render_landscape
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          set -o pipefail
          if ! python render.py "projects/${PROJECT_INPUT}" --config /tmp/config-render.yaml --settings-overrides /tmp/settings-overrides.json 2>&1 | tee /tmp/render-main.log; then
            echo "RENDER_LANDSCAPE_FAILED: last 30 lines of /tmp/render-main.log (includes traceback tail):"
            tail -n 30 /tmp/render-main.log
            exit 1
          fi
      - name: Render caption-card MP4
        if: ${{ !inputs.preview_only }}
        id: render_card
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import yaml
          name = os.environ["PROJECT_INPUT"]
          source = Path("projects") / name
          target = Path("projects") / f"{name}-card"
          target.mkdir(parents=True, exist_ok=True)
          (target / "images").mkdir(parents=True, exist_ok=True)
          shutil.copy2(source / "script.txt", target / "script.txt")
          shutil.copytree(source / "images", target / "images", dirs_exist_ok=True)
          voice = next((source / f"voice{ext}" for ext in (".mp3", ".wav", ".m4a", ".ogg")
                        if (source / f"voice{ext}").is_file()), None)
          if voice is None:
              raise SystemExit("No voice file found for caption-card render.")
          shutil.copy2(voice, target / voice.name)
          for music in source.glob('music.*'):
              if music.is_file() and music.suffix.lower() in {'.mp3', '.wav', '.m4a', '.ogg'}:
                  shutil.copy2(music, target / music.name)
          config = yaml.safe_load(Path("/tmp/config-render.yaml").read_text(encoding="utf-8")) if Path("/tmp/config-render.yaml").is_file() else yaml.safe_load(Path("config.yaml").read_text(encoding="utf-8"))
          config["captions"]["caption_mode"] = "card"
          Path("/tmp/config-card.yaml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          cp output/notes.txt /tmp/landscape-notes.txt
          set -o pipefail
          python render.py "projects/${PROJECT_INPUT}-card" --config /tmp/config-card.yaml --settings-overrides /tmp/settings-overrides.json 2>&1 | tee /tmp/render-card.log
          cp /tmp/landscape-notes.txt output/notes.txt
      - name: Render vertical Shorts MP4
        if: ${{ !inputs.preview_only && inputs.shorts_on }}
        id: render_shorts
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          SHORTS_START: ${{ github.event.inputs.shorts_start || '0' }}
          SHORTS_END: ${{ github.event.inputs.shorts_end || '10' }}
          SHORTS_ON_INPUT: ${{ github.event.inputs.shorts_on || 'true' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.shorts import make_shorts
          from src.utils import load_config
          name = os.environ["PROJECT_INPUT"]
          source = Path("output") / f"{name}.mp4"
          target = Path("output") / f"{name}-shorts.mp4"
          if not source.is_file():
              raise SystemExit(f"Landscape source is missing: {source}")
          cfg = load_config()
          make_shorts(source, target, float(os.environ["SHORTS_START"]), float(os.environ["SHORTS_END"]),
                      int(cfg.get("video", {}).get("fps", 24)), int(cfg.get("video", {}).get("crf", 20)))
          print(f"SHORTS_OK={target}")
      - name: Verify MP4 streams and duration
        if: ${{ !inputs.preview_only }}
        id: verify_outputs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          videos = list(Path("output").glob("*.mp4"))
          if not videos: raise SystemExit("No MP4 output found.")
          for video in videos:
              probe = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(video)]))
              streams = probe.get("streams", [])
              if not any(s.get("codec_type") == "video" for s in streams): raise SystemExit(f"{video} has no video stream")
              audio = [s for s in streams if s.get("codec_type") == "audio"]
              if not audio: raise SystemExit(f"{video} has no audio stream")
              print(f"VERIFIED {video}: {probe['format'].get('duration')} sec, audio={audio[0].get('codec_name')}, sample_rate={audio[0].get('sample_rate')}")
          PY
      - name: Check voice trimming, duration and preview frames
        if: ${{ !inputs.preview_only }}
        id: media_quality_checks
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          VOICE_SOURCE_INPUT: ${{ github.event.inputs.voice_source || 'project' }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          from src.frame_edges import frame_edge_verdict
          project = Path('projects') / os.environ['PROJECT_INPUT']
          source = None
          if os.environ.get('VOICE_SOURCE_INPUT', 'project') == 'kokoro':
              source = project / 'voice.wav'
          else:
              source = next((project / ('voice' + ext) for ext in ('.mp3','.wav','.m4a','.ogg')
                             if (project / ('voice' + ext)).is_file()), None)
          prepared = project / 'audio' / 'voiceover.wav'
          video = Path('output') / (os.environ['PROJECT_INPUT'] + '.mp4')
          if not source or not source.is_file() or not prepared.is_file():
              raise SystemExit(f'VOICE_TRIM_CHECK=FAIL; source={source}; prepared={prepared}')
          def probe_duration(path):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=noprint_wrappers=1:nokey=1',str(path)], text=True).strip())
          def edge_silence(path):
              p = subprocess.run(['ffmpeg','-hide_banner','-i',str(path),'-af',
                  'silencedetect=noise=-48dB:d=0.15','-f','null','-'],capture_output=True,text=True)
              import re
              log=p.stderr
              starts=[float(x) for x in re.findall(r'silence_start:\s*([0-9.]+)',log)]
              ends=[float(x) for x in re.findall(r'silence_end:\s*([0-9.]+)',log)]
              total=probe_duration(path); leading=ends[0] if starts and starts[0] <= .05 and ends else (total if starts and starts[0] <= .05 else 0.0)
              trailing=total-starts[-1] if starts and starts[-1] >= (ends[-1] if ends else 0.0) and starts[-1] < total else 0.0
              return min(total,max(0.0,leading)),min(total,max(0.0,trailing))
          source_duration, prepared_duration = probe_duration(source), probe_duration(prepared)
          leading, trailing = edge_silence(prepared)
          removed = source_duration - prepared_duration
          print(f'VOICE_TRIM_SOURCE={source}; source_duration={source_duration:.2f}s; prepared_duration={prepared_duration:.2f}s; duration_delta={removed:.2f}s')
          print(f'VOICE_TRIM_PREPARED_EDGES=leading {leading:.2f}s; trailing {trailing:.2f}s')
          if leading > .30 or trailing > .50:
              raise SystemExit('VOICE_TRIM_CHECK=FAIL; prepared edge silence exceeds 0.30s leading / 0.50s trailing')
          print('VOICE_TRIM_CHECK=PASS')
          video_duration = probe_duration(video)
          delta = abs(video_duration - prepared_duration)
          print(f'VIDEO_VOICE_DURATION=video {video_duration:.2f}s; prepared_voice {prepared_duration:.2f}s; difference {delta:.2f}s')
          if delta > .7:
              raise SystemExit('VIDEO_VOICE_DURATION_CHECK=FAIL; difference exceeds 0.70s')
          print('VIDEO_VOICE_DURATION_CHECK=PASS')
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','json',str(video)],text=True))
          duration=float(info['format']['duration'])
          times=[duration*x/7 for x in (1,2,3,4,5,6)]
          frames=[]
          edge_failures=[]
          source_images=sorted([p for p in (project / 'images').iterdir()
                                if p.is_file() and p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}],
                               key=lambda p: [int(part) if part.isdigit() else part.lower()
                                              for part in __import__('re').split(r'(\\d+)', p.name)])
          if not source_images:
              raise SystemExit('FRAME_EDGE_CHECK=FAIL; no source scene images found')
          for i,t in enumerate(times,1):
              path=Path('/tmp')/f'frame-preview-{i}.png'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',f'{t:.3f}','-i',str(video),'-frames:v','1','-vf','scale=480:-1',str(path)],check=True)
              image=Image.open(path).convert('RGB')
              # Pair each sample with the source scene at the same relative position in
              # strict filename order; scale/crop that source to the sampled frame size.
              source_path=source_images[min(len(source_images)-1, int((t / max(duration, 0.001))*len(source_images)))]
              source_image=Image.open(source_path).convert('RGB')
              verdict=frame_edge_verdict(image, source_image, strip_px=4)
              if i <= 3:
                  print(f"FRAME_EDGE_SAMPLE={i} source={source_path.name} frame_edges={verdict['frame_edges']} source_edges={verdict['source_edges']} verdict={'PASS' if verdict['passed'] else 'FAIL'}")
              edge_failures.extend(f"sample {i} {side}: frame black edge absent from source" for side in verdict['failed_sides'])
              frames.append(image)
          tile_w,tile_h=480,frames[0].height
          sheet=Image.new('RGB',(tile_w*3,(tile_h+28)*2),'white')
          draw=ImageDraw.Draw(sheet)
          for i,im in enumerate(frames):
              x=(i%3)*tile_w; y=(i//3)*(tile_h+28)
              sheet.paste(im,(x,y+28)); draw.text((x+8,y+7),f'Frame {i+1} @ {times[i]:.1f}s',fill='black')
          Path('output').mkdir(exist_ok=True)
          sheet.save('output/frames-preview.png')
          print('FRAME_PREVIEW=output/frames-preview.png')
          if edge_failures:
              raise SystemExit('FRAME_EDGE_CHECK=FAIL; ' + '; '.join(edge_failures))
          print('FRAME_EDGE_CHECK=PASS; sampled 6 frames; no black edge bars detected')
          PY
      - name: Record first workflow error
        id: record_first_error
        if: always()
        env:
          OUTCOME_CHECKOUT: ${{ steps.checkout.outcome }}
          OUTCOME_SETUP_PYTHON: ${{ steps.setup_python.outcome }}
          OUTCOME_CACHE_WHISPER: ${{ steps.cache_whisper.outcome }}
          OUTCOME_INSTALL_FFMPEG: ${{ steps.install_ffmpeg.outcome }}
          OUTCOME_INSTALL_DEPENDENCIES: ${{ steps.install_dependencies.outcome }}
          OUTCOME_INSTALL_FONT: ${{ steps.install_font.outcome }}
          OUTCOME_SYNTAX_VALIDATION: ${{ steps.syntax_validation.outcome }}
          OUTCOME_ALIGNMENT_TESTS: ${{ steps.alignment_tests.outcome }}
          OUTCOME_ENSURE_SAMPLE: ${{ steps.ensure_sample.outcome }}
          OUTCOME_RENDER_LANDSCAPE: ${{ steps.render_landscape.outcome }}
          OUTCOME_RENDER_CARD: ${{ steps.render_card.outcome }}
          OUTCOME_RENDER_SHORTS: ${{ steps.render_shorts.outcome }}
          OUTCOME_VERIFY_OUTPUTS: ${{ steps.verify_outputs.outcome }}
          OUTCOME_MEDIA_QUALITY_CHECKS: ${{ steps.media_quality_checks.outcome }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os
          from pathlib import Path
          ordered = [
              ("OUTCOME_CHECKOUT", "Checkout", None),
              ("OUTCOME_SETUP_PYTHON", "Set up Python", None),
              ("OUTCOME_CACHE_WHISPER", "Cache faster-whisper model", None),
              ("OUTCOME_INSTALL_FFMPEG", "Install FFmpeg and fonts", None),
              ("OUTCOME_INSTALL_DEPENDENCIES", "Install dependencies", None),
              ("OUTCOME_INSTALL_FONT", "Install optional Nunito font", None),
              ("OUTCOME_SYNTAX_VALIDATION", "Run syntax and YAML validation", None),
              ("OUTCOME_ALIGNMENT_TESTS", "Run alignment unit tests", None),
              ("OUTCOME_ENSURE_SAMPLE", "Ensure sample project and offline inputs", None),
              ("OUTCOME_RENDER_LANDSCAPE", "Render landscape MP4", "/tmp/render-main.log"),
              ("OUTCOME_RENDER_CARD", "Render caption-card MP4", "/tmp/render-card.log"),
              ("OUTCOME_RENDER_SHORTS", "Render vertical Shorts MP4", None),
              ("OUTCOME_VERIFY_OUTPUTS", "Verify MP4 streams and duration", None),
              ("OUTCOME_MEDIA_QUALITY_CHECKS", "Check voice trimming, duration and preview frames", "/tmp/render-main.log"),
          ]
          failed = next((item for item in ordered if os.environ.get(item[0]) == "failure"), None)
          destination = Path("output/first-error.txt")
          if failed:
              _, step_name, log_path = failed
              detail = f"Step outcome: failure ({failed[0]})"
              if log_path and Path(log_path).is_file():
                  lines = [line.rstrip() for line in Path(log_path).read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
                  if lines:
                      detail = "\n".join(lines[-30:])
              message = f"Step: {step_name}\nError:\n{detail}\n"
              if not destination.is_file() or not destination.stat().st_size:
                  destination.write_text(message, encoding="utf-8")
              print("FIRST_FAILURE_RECORDED")
              print(destination.read_text(encoding="utf-8"))
          else:
              print("FIRST_FAILURE=none before final self-check")
          PY
      - name: Final self-check and summary table
        if: ${{ always() && !inputs.preview_only }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          SHORTS_ON_INPUT: ${{ github.event.inputs.shorts_on || 'true' }}
          VOICE_SOURCE_INPUT: ${{ github.event.inputs.voice_source || 'project' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          name = os.environ["PROJECT_INPUT"]
          project = Path("projects") / name
          output = Path("output")
          results = []
          first_error_path = output / "first-error.txt"
          first_error_text = first_error_path.read_text(encoding="utf-8", errors="replace").strip() if first_error_path.is_file() else ""
          first_step = next((line.split(":", 1)[1].strip() for line in first_error_text.splitlines() if line.startswith("Step:")), "")
          if first_error_text:
              print("\nFIRST FAILURE (recorded before summary):")
              print(first_error_text)
          else:
              print("\nFIRST FAILURE: none recorded before final self-check")

          def check(label, ok, detail):
              status = "PASS" if ok else "FAIL"
              # Once an earlier workflow step failed, downstream self-checks may
              # be unable to run or may only report missing outputs caused by
              # that first failure. Keep the original error authoritative and
              # mark these dependent checks SKIPPED instead of multiplying failures.
              if not ok and first_error_text:
                  status = "SKIPPED"
              results.append((label, status, str(detail)))
              print(f"{label}: {status} - {detail}")

          def probe(path):
              return json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(path)
              ], text=True))

          voice_source = os.environ.get("VOICE_SOURCE_INPUT", "project")
          source_voice = (project / "voice.wav") if voice_source == "kokoro" else next(
              (project / f"voice{ext}" for ext in (".mp3", ".wav", ".m4a", ".ogg")
               if (project / f"voice{ext}").is_file()), None)
          prepared_voice = project / "audio" / "voiceover.wav"
          trim_ok = False
          trim_detail = "correct source or prepared voice file is missing"
          if source_voice and source_voice.is_file() and prepared_voice.is_file():
              def duration(path):
                  return float(probe(path)["format"].get("duration", 0))
              source_duration = duration(source_voice)
              prepared_duration = duration(prepared_voice)
              edge = subprocess.run(
                  ["ffmpeg", "-hide_banner", "-i", str(prepared_voice),
                   "-af", "silencedetect=noise=-48dB:d=0.15", "-f", "null", "-"],
                  capture_output=True, text=True,
              )
              starts = [float(x) for x in re.findall(r"silence_start:\s*([0-9.]+)", edge.stderr)]
              ends = [float(x) for x in re.findall(r"silence_end:\s*([0-9.]+)", edge.stderr)]
              leading = ends[0] if starts and starts[0] <= 0.05 and ends else (prepared_duration if starts and starts[0] <= 0.05 else 0.0)
              trailing = prepared_duration - starts[-1] if starts and starts[-1] >= (ends[-1] if ends else 0.0) and starts[-1] < prepared_duration else 0.0
              shortened = max(0.0, source_duration - prepared_duration)
              trim_ok = source_duration > 0 and prepared_duration > 0 and leading <= 0.30 and trailing <= 0.50
              trim_detail = (f"source={source_duration:.2f}s; prepared={prepared_duration:.2f}s; "
                             f"shortened={shortened:.2f}s; prepared edge silence leading={leading:.2f}s/trailing={trailing:.2f}s")
          check("Voice silence trimmed", trim_ok, trim_detail)

          main = output / f"{name}.mp4"
          main_ok = main.is_file() and main.stat().st_size > 0
          check("Landscape MP4 exists", main_ok, main)
          if main_ok:
              main_probe = probe(main)
              videos = [stream for stream in main_probe["streams"] if stream.get("codec_type") == "video"]
              audios = [stream for stream in main_probe["streams"] if stream.get("codec_type") == "audio"]
              landscape = bool(videos and int(videos[0].get("width", 0)) > int(videos[0].get("height", 0)))
              check("Landscape dimensions", landscape, f"{videos[0].get('width')}x{videos[0].get('height')}" if videos else "video stream missing")
              sample_rate_ok = bool(audios and int(audios[0].get("sample_rate", 0)) == 44100)
              check("Final audio 44.1 kHz", sample_rate_ok, audios[0].get("sample_rate") if audios else "audio stream missing")
              measured = subprocess.run(
                  ["ffmpeg", "-hide_banner", "-i", str(main), "-af",
                   "loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json", "-f", "null", "-"],
                  capture_output=True, text=True,
              )
              start = measured.stderr.rfind("{")
              end = measured.stderr.find("}", start)
              loudness = None
              if start >= 0 and end > start:
                  try:
                      loudness = float(json.loads(measured.stderr[start:end + 1]).get("input_i"))
                  except (TypeError, ValueError, json.JSONDecodeError):
                      loudness = None
              loudness_ok = loudness is not None and abs(loudness - (-16.0)) <= 2.5
              check("Loudness within 2.5 LU of -16 LUFS", loudness_ok,
                    f"{loudness:.2f} LUFS" if loudness is not None else "measurement unavailable")
          else:
              check("Landscape dimensions", False, "landscape MP4 unavailable")
              check("Final audio 44.1 kHz", False, "landscape MP4 unavailable")
              check("Loudness within 2.5 LU of -16 LUFS", False, "landscape MP4 unavailable")

          log = Path("/tmp/render-main.log")
          ducking_ran = log.is_file() and "MUSIC_DUCKING=PASS" in log.read_text(encoding="utf-8", errors="replace")
          check("Music ducking ran", ducking_ran, "sidechaincompress marker in landscape render log" if ducking_ran else "music ducking marker missing")

          srt = output / f"{name}.srt"
          captions_ok = srt.is_file() and srt.stat().st_size > 0 and any(
              line.strip() and not line.strip().isdigit() and "-->" not in line
              for line in srt.read_text(encoding="utf-8", errors="replace").splitlines()
          )
          check("Captions present", captions_ok, srt)
          card = output / f"{name}-card.mp4"
          shorts = output / f"{name}-shorts.mp4"
          check("Caption-card MP4 exists", card.is_file() and card.stat().st_size > 0, card)
          shorts_enabled = os.environ.get("SHORTS_ON_INPUT", "true").lower() not in {"false", "0", "no", "off"}
          check("Shorts MP4 exists", (shorts.is_file() and shorts.stat().st_size > 0) if shorts_enabled else True,
                shorts if shorts_enabled else "Shorts disabled by settings")
          check(".srt exists", srt.is_file() and srt.stat().st_size > 0, srt)
          notes = output / "notes.txt"
          check("notes.txt exists", notes.is_file() and notes.stat().st_size > 0, notes)
          thumbnails = sorted(output.glob(f"{name}-thumbnail.*"))
          check("Thumbnail exists", bool(thumbnails and thumbnails[0].stat().st_size > 0), thumbnails[0] if thumbnails else "thumbnail missing")

          print("\nSUMMARY TABLE")
          print("| Check | Result | Detail |")
          print("|---|---|---|")
          for label, status, detail in results:
              print(f"| {label} | {status} | {detail.replace('|', '/')} |")
          markdown = ["| Check | Result | Detail |", "|---|---|---|"]
          markdown.extend(f"| {label} | {status} | {str(detail).replace('|', '/')} |" for label, status, detail in results)
          (output / "quality-checks.md").write_text("\\n".join(markdown) + "\\n", encoding="utf-8")
                    failed = [label for label, status, _ in results if status == "FAIL"]
          if failed and not first_error_text:
              first_label = failed[0]
              first_error_text = f"Step: Final self-check\nError: {first_label}\n"
              first_error_path.write_text(first_error_text, encoding="utf-8")
              first_step = "Final self-check"
              print("FIRST_FAILURE_RECORDED")
              print(first_error_text)
          if first_error_text and not failed:
              failed.append("Earlier workflow step failed: " + first_step)
          print(f"SELF_CHECK_SUMMARY={'FAIL' if failed else 'PASS'}")
          if failed:
              raise SystemExit("First failure: " + first_step + "; self-check failures: " + ", ".join(failed))
          PY
      - name: Upload all output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-video-${{ github.event.inputs.project || 'video-001' }}
          path: output/*
          if-no-files-found: warn
          retention-days: 14
