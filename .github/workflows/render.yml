name: Render Manga Video
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under projects/, e.g. video-001"
        required: true
        default: video-001
        type: string
      shorts_start:
        description: "Optional Shorts start seconds"
        required: false
        type: string
      shorts_end:
        description: "Optional Shorts end seconds"
        required: false
        type: string
      test_voice:
        description: "Generate a temporary test voice.wav with eSpeak to exercise voice-file alignment (acceptance test only)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ runner.os }}-base.en-v1
          restore-keys: |
            faster-whisper-${{ runner.os }}-base.en-
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install optional Nunito font
        run: python setup_fonts.py
      - name: Run alignment unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate project
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          name=os.environ["PROJECT_INPUT"].strip()
          if not name or "/" in name or chr(92) in name or name in {".",".."}:
              raise SystemExit("Project must be one folder name such as video-001.")
          p=Path("projects")/name
          if not (p/"script.txt").is_file(): raise SystemExit(f"Missing script file: {p/'script.txt'}")
          print(f"Project ready: {p}")
          PY
      - name: Generate temporary acceptance-test voice.wav
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_voice) || (github.event_name == 'push' && github.event.head_commit.message == 'Run voice-file acceptance test') }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          project = Path("projects") / os.environ["PROJECT_INPUT"]
          text = " ".join(line.strip() for line in (project / "script.txt").read_text(encoding="utf-8").splitlines() if line.strip())
          target = project / "voice.wav"
          result = subprocess.run(["espeak-ng", "-v", "en-us", "-s", "145", "-w", str(target), text], capture_output=True, text=True)
          if result.returncode or not target.is_file() or target.stat().st_size < 1000:
              raise SystemExit(f"Could not generate acceptance voice.wav: {result.stderr}")
          print(f"Generated temporary test audio: {target} ({target.stat().st_size} bytes)")
          PY
      - name: Render landscape MP4
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: python render.py "projects/${PROJECT_INPUT}"
      - name: Test black caption-card mode
        if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run voice-file acceptance test' }}
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          import yaml
          source = Path("projects/video-001")
          target = Path("projects/video-001-card")
          (target / "images").mkdir(parents=True, exist_ok=True)
          shutil.copy2(source / "script.txt", target / "script.txt")
          shutil.copy2(source / "voice.wav", target / "voice.wav")
          shutil.copytree(source / "images", target / "images", dirs_exist_ok=True)
          config = yaml.safe_load(Path("config.yaml").read_text(encoding="utf-8"))
          config["captions"]["caption_mode"] = "card"
          Path("/tmp/config-card.yaml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          python render.py projects/video-001-card --config /tmp/config-card.yaml
      - name: Render optional Shorts MP4
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.shorts_start != '' && github.event.inputs.shorts_end != '') || (github.event_name == 'push' && github.event.head_commit.message == 'Run voice-file acceptance test') }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          SHORTS_START: ${{ github.event.inputs.shorts_start || '0' }}
          SHORTS_END: ${{ github.event.inputs.shorts_end || '10' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.shorts import make_shorts
          from src.utils import load_config
          cfg = load_config()
          project = os.environ["PROJECT_INPUT"]
          source = Path("output") / (project + ".mp4")
          target = Path("output") / (project + "-shorts.mp4")
          make_shorts(source, target, float(os.environ["SHORTS_START"]), float(os.environ["SHORTS_END"]),
                      int(cfg.get("video", {}).get("fps", 24)), int(cfg.get("video", {}).get("crf", 20)))
          print("SHORTS_OK=" + str(target))
          PY
      - name: Verify MP4 streams and duration
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          videos = list(Path("output").glob("*.mp4"))
          if not videos: raise SystemExit("No MP4 output found.")
          for video in videos:
              probe = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(video)]))
              streams = probe.get("streams", [])
              if not any(s.get("codec_type") == "video" for s in streams): raise SystemExit(f"{video} has no video stream")
              audio = [s for s in streams if s.get("codec_type") == "audio"]
              if not audio: raise SystemExit(f"{video} has no audio stream")
              print(f"VERIFIED {video}: {probe['format'].get('duration')} sec, audio={audio[0].get('codec_name')}, sample_rate={audio[0].get('sample_rate')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manga-video-${{ github.event.inputs.project || 'video-001' }}
          path: output/*
          if-no-files-found: error
          retention-days: 14
