name: Render Manga Video
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project folder under projects/, e.g. video-001"
        required: true
        default: video-001
        type: string
      shorts_start:
        description: "Optional Shorts start seconds"
        required: false
        type: string
      shorts_end:
        description: "Optional Shorts end seconds"
        required: false
        type: string
      test_voice:
        description: "Generate a temporary test voice.mp3 at 22.05 kHz with leading silence (acceptance test only)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: faster-whisper-${{ runner.os }}-base.en-v1
          restore-keys: |
            faster-whisper-${{ runner.os }}-base.en-
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install optional Nunito font
        run: python setup_fonts.py
      - name: Run alignment unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate project
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          name=os.environ["PROJECT_INPUT"].strip()
          if not name or "/" in name or chr(92) in name or name in {".",".."}:
              raise SystemExit("Project must be one folder name such as video-001.")
          p=Path("projects")/name
          if not (p/"script.txt").is_file(): raise SystemExit(f"Missing script file: {p/'script.txt'}")
          print(f"Project ready: {p}")
          PY
      - name: Generate temporary acceptance-test voice.mp3 with leading silence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_voice }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          project = Path("projects") / os.environ["PROJECT_INPUT"]
          text = " ".join(line.strip() for line in (project / "script.txt").read_text(encoding="utf-8").splitlines() if line.strip())
          raw = Path("/tmp/acceptance-voice.wav")
          target = project / "voice.mp3"
          result = subprocess.run(["espeak-ng", "-v", "en-us", "-s", "145", "-w", str(raw), text], capture_output=True, text=True)
          if result.returncode or not raw.is_file() or raw.stat().st_size < 1000:
              raise SystemExit(f"Could not generate source test voice: {result.stderr}")
          subprocess.run(["ffmpeg", "-y", "-i", str(raw), "-af", "adelay=1500|1500", "-ar", "22050", "-ac", "2", "-codec:a", "libmp3lame", "-b:a", "96k", str(target)], check=True, capture_output=True, text=True)
          print(f"Generated test MP3 with 1.5s leading silence at 22.05 kHz: {target} ({target.stat().st_size} bytes)")
          PY
      - name: Generate quiet music pad and test thumbnail
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_voice }}
        run: |
          mkdir -p assets/music projects/video-001/thumbnail
          python -c "from pathlib import Path; from src.sample_assets import ensure_sample_images; ensure_sample_images(Path('projects/video-001'))"
          ffmpeg -y -f lavfi -i "anoisesrc=color=pink:amplitude=0.01:sample_rate=44100:duration=60" -codec:a libmp3lame -b:a 96k assets/music/000-acceptance-pad.mp3
          cp projects/video-001/images/01.png projects/video-001/thumbnail/acceptance-thumbnail.png
          ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=nw=1 assets/music/000-acceptance-pad.mp3
      - name: Render landscape MP4
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
        run: python render.py "projects/${PROJECT_INPUT}"
      - name: Test black caption-card mode
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_voice }}
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          import yaml
          source = Path("projects/video-001")
          target = Path("projects/video-001-card")
          (target / "images").mkdir(parents=True, exist_ok=True)
          shutil.copy2(source / "script.txt", target / "script.txt")
          shutil.copy2(source / "voice.mp3", target / "voice.mp3")
          shutil.copytree(source / "images", target / "images", dirs_exist_ok=True)
          config = yaml.safe_load(Path("config.yaml").read_text(encoding="utf-8"))
          config["captions"]["caption_mode"] = "card"
          Path("/tmp/config-card.yaml").write_text(yaml.safe_dump(config, sort_keys=False), encoding="utf-8")
          PY
          python render.py projects/video-001-card --config /tmp/config-card.yaml
      - name: Render optional Shorts MP4
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_voice) || (github.event_name == 'workflow_dispatch' && inputs.shorts_start != '' && inputs.shorts_end != '') }}
        env:
          PROJECT_INPUT: ${{ github.event.inputs.project || 'video-001' }}
          SHORTS_START: ${{ github.event.inputs.shorts_start || '0' }}
          SHORTS_END: ${{ github.event.inputs.shorts_end || '10' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from src.shorts import make_shorts
          from src.utils import load_config
          cfg = load_config()
          project = os.environ["PROJECT_INPUT"]
          source = Path("output") / (project + ".mp4")
          target = Path("output") / (project + "-shorts.mp4")
          make_shorts(source, target, float(os.environ["SHORTS_START"]), float(os.environ["SHORTS_END"]),
                      int(cfg.get("video", {}).get("fps", 24)), int(cfg.get("video", {}).get("crf", 20)))
          print("SHORTS_OK=" + str(target))
          PY
      - name: Verify MP4 streams and duration
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          videos = list(Path("output").glob("*.mp4"))
          if not videos: raise SystemExit("No MP4 output found.")
          for video in videos:
              probe = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(video)]))
              streams = probe.get("streams", [])
              if not any(s.get("codec_type") == "video" for s in streams): raise SystemExit(f"{video} has no video stream")
              audio = [s for s in streams if s.get("codec_type") == "audio"]
              if not audio: raise SystemExit(f"{video} has no audio stream")
              print(f"VERIFIED {video}: {probe['format'].get('duration')} sec, audio={audio[0].get('codec_name')}, sample_rate={audio[0].get('sample_rate')}")
          PY
      - name: Verify companion artifacts and loudness
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_voice }}
        run: |
          test -s output/video-001.mp4
          test -s output/video-001.srt
          test -s output/notes.txt
          test -s output/video-001-thumbnail.png
          test -s output/video-001-card.mp4
          test -s output/video-001-shorts.mp4
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          video=Path("output/video-001.mp4")
          probe=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(video)]))
          audio=next(s for s in probe["streams"] if s.get("codec_type")=="audio")
          assert int(audio["sample_rate"]) == 44100, audio
          measured=subprocess.run(["ffmpeg","-hide_banner","-i",str(video),"-af","loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json","-f","null","-"],capture_output=True,text=True)
          print("AUDIO_STREAM_SAMPLE_RATE="+audio["sample_rate"])
          print("LOUDNORM_MEASUREMENT:")
          print(measured.stderr[-1800:])
          print("COMPANION_ARTIFACTS_OK: SRT, notes, thumbnail")
          if "input_i" not in measured.stderr: raise SystemExit("Could not measure output loudness")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: manga-video-${{ github.event.inputs.project || 'video-001' }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

      - name: Final output and audio diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          outputs = sorted(p for p in Path("output").glob("*") if p.is_file())
          print("OUTPUT_FILE_LIST:")
          for item in outputs:
              print(f"OUTPUT_FILE: {item} ({item.stat().st_size} bytes)")
          videos = [p for p in outputs if p.suffix.lower() == ".mp4"]
          if not videos:
              print("FINAL_DIAGNOSTICS=FAIL: no MP4 files found")
              raise SystemExit(1)
          failed = False
          for video in videos:
              probe = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-select_streams", "a:0", "-show_entries", "stream=sample_rate", "-of", "json", str(video)], text=True))
              audio = probe.get("streams", [])
              if not audio:
                  print(f"AUDIO_SAMPLE_RATE_HZ {video}=MISSING")
                  failed = True
                  continue
              rate = int(audio[0].get("sample_rate", 0))
              print(f"AUDIO_SAMPLE_RATE_HZ {video}={rate}")
              measured = subprocess.run(["ffmpeg", "-hide_banner", "-i", str(video), "-af", "loudnorm=I=-16:TP=-1.5:LRA=11:print_format=json", "-f", "null", "-"], capture_output=True, text=True)
              start = measured.stderr.rfind("{")
              end = measured.stderr.find("}", start)
              if start < 0 or end < 0:
                  print(f"LOUDNESS_LUFS {video}=UNMEASURABLE")
                  print(measured.stderr[-1200:])
                  failed = True
                  continue
              report = json.loads(measured.stderr[start:end + 1])
              loudness = report.get("input_i", "unknown")
              print(f"LOUDNESS_LUFS {video}={loudness}")
              try:
                  if rate != 44100 or abs(float(loudness) - (-16.0)) > 2.5:
                      failed = True
              except (TypeError, ValueError):
                  failed = True
          print("FINAL_DIAGNOSTICS=" + ("FAIL" if failed else "PASS"))
          if failed:
              raise SystemExit(1)
          PY
