name: Acceptance
run-name: Acceptance checks for manga-video-maker
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  kokoro_color:
    name: A - Kokoro color render
    uses: ./.github/workflows/render.yml
    with:
      project: video-001
      voice_source: kokoro
      voice: af_heart
      voice_speed: '1.00'
      style: color
      motion_intensity: normal
      music_on: true
      shorts_on: true
      artifact_name: master-video-video-001
  upload_bw:
    name: B - Upload voice BW manga render
    needs: kokoro_color
    if: always()
    uses: ./.github/workflows/render.yml
    with:
      project: video-001
      voice_source: upload
      voice: af_heart
      voice_speed: '1.00'
      style: bw_manga
      motion_intensity: normal
      music_on: true
      shorts_on: true
      artifact_name: master-video-video-001-upload-bw
  acceptance_summary:
    name: Final acceptance summary
    if: always()
    needs: [kokoro_color, upload_bw]
    runs-on: ubuntu-latest
    steps:
      - name: Download any run artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: acceptance-artifacts
      - name: Write final verdict and failure details
        env:
          A_RESULT: ${{ needs.kokoro_color.result }}
          B_RESULT: ${{ needs.upload_bw.result }}
        run: |
          python scripts/acceptance_step_01.py
